services:
  jupyter:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: spus-ft-brev:latest
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    environment:
      JUPYTER_PORT: 8888
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-brev}
      JUPYTER_ROOT: /workspace/tut
      SPUS_FT_AUX_ROOT: /workspace/tut-aux
      FMOD_DATA_ROOT: /workspace/tut-aux/spus-ft-data
      FMOD_MODELS_ROOT: /workspace/tut-aux/spus-models
      FMOD_RUNS_ROOT: /workspace/tut-aux/spus-ft-runs
      FMOD_CACHE_ROOT: /workspace/tut-aux/spus-ft-cache
    volumes:
      - .:/workspace/tut
      - ${TUT_AUX_DIR:-../tut-aux}:/workspace/tut-aux
    working_dir: /workspace/tut
    stdin_open: true
    tty: true
    command: ["start-jupyter.sh"]
    gpus: ${DOCKER_GPUS:-all}

  vertical-slice:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: spus-ft-brev:latest
    profiles: ["batch"]
    environment:
      SPUS_FT_AUX_ROOT: /workspace/tut-aux
      FMOD_DATA_ROOT: /workspace/tut-aux/spus-ft-data
      FMOD_MODELS_ROOT: /workspace/tut-aux/spus-models
      FMOD_RUNS_ROOT: /workspace/tut-aux/spus-ft-runs
      FMOD_CACHE_ROOT: /workspace/tut-aux/spus-ft-cache
    volumes:
      - .:/workspace/tut
      - ${TUT_AUX_DIR:-../tut-aux}:/workspace/tut-aux
    working_dir: /workspace/tut
    command: ["run-vertical-slice.sh"]
    gpus: ${DOCKER_GPUS:-all}
